<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WestHaven Lékař | Lékařská komora</title>
  <style>
    :root {
      --ink: #22170f;
      --paper: #f2dfb6;
      --paper-light: #fff5dc;
      --gold: #d9ad62;
      --brown: #6e4b2c;
      --red: #9f3633;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.42);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--paper-light);
      background:
        radial-gradient(circle at 16% 12%, rgba(217, 173, 98, 0.18), transparent 30rem),
        radial-gradient(circle at 82% 78%, rgba(159, 54, 51, 0.12), transparent 28rem),
        linear-gradient(135deg, #130e0a 0%, #2a1d13 55%, #130e0a 100%);
      animation: pageFade 520ms ease both;
    }

    @keyframes pageFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 56px;
    }

    header {
      padding: 18px 0 22px;
      text-align: center;
    }

    .back {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid rgba(217, 173, 98, 0.5);
      background: rgba(51, 36, 22, 0.88);
      color: #f7dfad;
      text-decoration: none;
      font-weight: 700;
      transition: transform 150ms ease, background 150ms ease, color 150ms ease;
    }

    .back:hover {
      transform: translateY(-1px);
      background: var(--gold);
      color: #21160d;
    }

    h1 {
      margin: 24px 0 10px;
      font-size: clamp(2.4rem, 7vw, 5.2rem);
      line-height: 0.92;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 720px;
      margin: 0 auto;
      color: #d8c08d;
      font-size: 1.15rem;
      line-height: 1.55;
    }

    .charter {
      position: relative;
      margin-top: 24px;
      padding: clamp(26px, 5vw, 46px);
      border: 1px solid rgba(86, 55, 30, 0.65);
      border-top: 8px solid var(--red);
      background:
        linear-gradient(180deg, rgba(255, 246, 222, 0.98), rgba(242, 223, 182, 0.96));
      color: var(--ink);
      box-shadow: var(--shadow);
      animation: riseIn 420ms ease both;
      overflow: hidden;
    }

    .charter::before,
    .charter::after {
      content: "";
      position: absolute;
      inset: 14px;
      pointer-events: none;
      border: 2px solid rgba(68, 43, 22, 0.3);
    }

    .charter::after {
      inset: 22px;
      border-width: 1px;
      border-style: dotted;
      opacity: 0.7;
    }

    .charter-inner {
      position: relative;
      z-index: 1;
    }

    .seal {
      width: fit-content;
      margin: 0 auto 20px;
      padding: 7px 22px;
      border-top: 1px solid rgba(110, 75, 44, 0.42);
      border-bottom: 1px solid rgba(110, 75, 44, 0.42);
      color: #5d4329;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .leadership {
      text-align: center;
    }

    .rank {
      margin: 0;
      color: #6e4b2c;
      font-size: 0.98rem;
      font-weight: 900;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .name {
      margin: 8px 0 0;
      font-size: clamp(1.9rem, 5vw, 3.2rem);
      line-height: 1.04;
      font-weight: 900;
    }

    .divider {
      width: min(420px, 80%);
      height: 1px;
      margin: 28px auto;
      background: linear-gradient(90deg, transparent, rgba(110, 75, 44, 0.52), transparent);
    }

    .primaries {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .primary {
      min-height: 164px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 18px;
      border: 1px solid rgba(110, 75, 44, 0.32);
      background: rgba(255, 248, 231, 0.5);
      text-align: center;
    }

    .primary .name {
      font-size: clamp(1.45rem, 3vw, 2.05rem);
    }

    @media (max-width: 760px) {
      .primaries {
        grid-template-columns: 1fr;
      }

      .charter {
        padding: 24px 18px;
      }

      .charter::before {
        inset: 10px;
      }

      .charter::after {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="back" href="index.html">Zpět na hlavní menu</a>
      <h1>Lékařská komora</h1>
      <p class="subtitle">Přehled vedení státní lékařské služby a oblastních primářů.</p>
    </header>

    <main class="charter" aria-labelledby="chamberTitle">
      <div class="charter-inner">
        <div class="seal" aria-hidden="true">Úřední hierarchie</div>

        <section class="leadership" id="chamberTitle">
          <p class="rank">Hlavní státní lékař</p>
          <p class="name">Dr. Alistair Leach</p>
        </section>

        <div class="divider" aria-hidden="true"></div>

        <section aria-label="Oblastní primáři">
          <div class="primaries">
            <article class="primary">
              <p class="rank">Oblastní primář</p>
              <p class="name">Ridka Black McRight</p>
            </article>

            <article class="primary">
              <p class="rank">Oblastní primář</p>
              <p class="name">Aleksandra Smirnovskaja</p>
            </article>

            <article class="primary">
              <p class="rank">Oblastní primář</p>
              <p class="name">Piotr Kaczinski</p>
            </article>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
